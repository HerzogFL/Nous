[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-inquiry"
version = "0.1.0"
description = "A reproducible reference implementation of Socratic inquiry with information gain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
lm = ["torch>=2.4,<3", "transformers>=4.51,<6"]

[project.scripts]
nous = "nous.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
